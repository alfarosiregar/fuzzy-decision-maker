services:
  # -------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # -------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: dks_postgres_db
    restart: always
    environment:
      POSTGRES_DB: dks_fuzzy_db
      POSTGRES_USER: dks_user
      POSTGRES_PASSWORD: dks_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./shared/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - dks_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dks_user -d dks_fuzzy_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. Streamlit DSS Application Service
  # -------------------------------------------------------------
  web:
    image: alfarosiregar/dks-backend:latest
    build:
      context: ./services/streamlit
      dockerfile: Dockerfile
    container_name: dks_streamlit_app
    restart: always
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: dks_fuzzy_db
      POSTGRES_USER: dks_user
      POSTGRES_PASSWORD: dks_password_2026
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dks_network

  # -------------------------------------------------------------
  # 3. Vue 3 Landing Page Frontend Service
  # -------------------------------------------------------------
  frontend:
    image: alfarosiregar/dks-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dks_vue_frontend
    restart: always
    ports:
      - "3000:80"
    networks:
      - dks_network

  # -------------------------------------------------------------
  # 4. Nginx Reverse Proxy Service (Exposing Port 80 & 3001)
  # -------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: dks_nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "3001:80"
      - "5173:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - frontend
    networks:
      - dks_network

networks:
  dks_network:
    driver: bridge

volumes:
  postgres_data:
