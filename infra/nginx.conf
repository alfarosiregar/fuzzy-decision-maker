events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging settings
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name _;

        client_max_body_size 50M;

        # Docker internal DNS resolver for dynamic hostname resolution
        resolver 127.0.0.11 valid=10s ipv6=off;

        # 1. Vue.js Public Landing Page Route
        location / {
            set $frontend_svc "http://frontend:80";
            proxy_pass $frontend_svc;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Streamlit DSS Application Route
        location /app {
            set $streamlit_svc "http://web:8501";
            proxy_pass $streamlit_svc;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Streamlit WebSocket Endpoint
        location /app/_stcore/stream {
            set $streamlit_stream "http://web:8501";
            proxy_pass $streamlit_stream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_read_timeout 86400;
        }
    }
}

